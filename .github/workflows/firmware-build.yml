name: Build EvoLights firmware

# Builds the *_evolights envs defined at the bottom of platformio.ini (anchored
# under EVOLIGHTS-ANCHOR: env-evolights). Each is an extension of an upstream
# WLED env that pulls in the cloud_relay usermod and the WLED_FORK_NAME flag.

on:
  push:
    branches: [evolights/main]
  pull_request:
    branches: [evolights/main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - esp32dev_evolights
          - esp32_eth_evolights
          - esp32s3dev_8MB_qspi_evolights
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build ${{ matrix.env }}
        run: pio run -e "${{ matrix.env }}"

      - name: Stage artifacts
        run: |
          mkdir -p artifacts
          find ".pio/build/${{ matrix.env }}" -maxdepth 1 -name '*.bin' -exec cp {} artifacts/ \;
          ls -lh artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: artifacts/*.bin
          retention-days: 30
