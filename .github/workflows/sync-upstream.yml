name: Sync upstream WLED

# Branch model:
#   main             — clean tracking branch, fast-forwarded from upstream/main
#   evolights/main   — our working branch with EvoLights customizations
#
# This workflow runs nightly (or on-demand). It:
#   1. Fast-forwards `main` to wled-dev/WLED@main
#   2. Tries to merge `main` into `evolights/main` automatically
#   3. On clean merge → opens (or updates) a PR with the result + build artifacts
#   4. On conflict   → opens an issue listing conflicting files for manual resolution
#
# Our customizations are preserved because they live in:
#   - new files (wled00/wled_cloud_auth.{h,cpp}, usermods/cloud_relay/*) — never conflict
#   - small touch-points in upstream files (wled.cpp, cfg.cpp) — only conflict if upstream
#     also edits the same hunks, which is rare

on:
  schedule:
    - cron: '17 7 * * *'   # 07:17 UTC daily
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream ref to merge (default: main)'
        default: 'main'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.email "evolights-bot@users.noreply.github.com"
          git config user.name  "EvoLights Sync Bot"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/wled/WLED.git || true
          git fetch upstream "${{ github.event.inputs.upstream_ref || 'main' }}"

      - name: Fast-forward main from upstream
        run: |
          git checkout main
          git merge --ff-only upstream/${{ github.event.inputs.upstream_ref || 'main' }}
          git push origin main

      - name: Attempt merge into evolights/main
        id: merge
        run: |
          git checkout evolights/main
          if git merge --no-ff --no-edit -m "chore: sync upstream WLED into evolights/main" main; then
            echo "result=clean" >> "$GITHUB_OUTPUT"
          else
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            echo "files<<EOF" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            git merge --abort
          fi

      # If git could merge cleanly, that proves no LINES collided — but it
      # does NOT prove our hooks are still in the right place. Run the
      # integration verifier on the merged tree before opening a PR. If it
      # fails, the merge silently damaged us; abort the merge and open a
      # damage issue instead of a PR.
      - name: Verify integration on merged tree
        id: verify
        if: steps.merge.outputs.result == 'clean'
        run: |
          set +e
          bash tools/verify-evolights-integration.sh > /tmp/verify.log 2>&1
          rc=$?
          cat /tmp/verify.log
          if [ "$rc" -ne 0 ]; then
            {
              echo "summary<<EOF"
              # Trim to just the failure lines for the issue body.
              grep -E "^\s*\[FAIL\]|EvoLights integration verification" /tmp/verify.log
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "result=damaged" >> "$GITHUB_OUTPUT"
            # Roll back the merge so evolights/main stays clean for next attempt.
            git reset --hard HEAD~1
          else
            echo "result=ok" >> "$GITHUB_OUTPUT"
          fi

      - name: Push sync branch and open PR (clean merge + verify pass)
        if: steps.merge.outputs.result == 'clean' && steps.verify.outputs.result == 'ok'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="sync/upstream-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git push -u origin "$BRANCH"
          gh pr create \
            --base evolights/main \
            --head "$BRANCH" \
            --title "Sync upstream WLED $(date +%Y-%m-%d)" \
            --body "Automated merge of upstream WLED \`main\` into \`evolights/main\`. EvoLights customizations were preserved without conflict and the integration verifier passed on the merged tree. Firmware build CI must still pass before merging." \
            || echo "PR may already exist"

      - name: Open conflict issue (git merge conflict)
        if: steps.merge.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Upstream WLED sync conflict $(date +%Y-%m-%d)" \
            --body "Automated merge of upstream into \`evolights/main\` hit conflicts in:
\`\`\`
${{ steps.merge.outputs.files }}
\`\`\`
Resolve locally with:
\`\`\`
git fetch upstream && git checkout evolights/main && git merge main
\`\`\`" \
            --label "sync-conflict"

      - name: Open damage issue (silent merge damage)
        if: steps.merge.outputs.result == 'clean' && steps.verify.outputs.result == 'damaged'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Upstream WLED sync damaged EvoLights integration $(date +%Y-%m-%d)" \
            --body "Git merged upstream WLED into \`evolights/main\` without line conflicts, BUT the integration verifier failed on the merged tree. Our hooks have been silently moved or removed. The merge has been rolled back; \`evolights/main\` is unchanged.

Verifier output:
\`\`\`
${{ steps.verify.outputs.summary }}
\`\`\`

Reproduce locally:
\`\`\`
git fetch upstream && git checkout evolights/main && git merge main
bash tools/verify-evolights-integration.sh
\`\`\`

Restore the missing/relocated hook(s), commit, and push. The verifier must pass before \`evolights/main\` accepts the upstream merge." \
            --label "sync-damage"
